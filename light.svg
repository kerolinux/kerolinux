<title id="title">Kiroles Aziz — Robotics Engineering profile</title>
<desc id="desc">A terminal-inspired robotics engineering profile featuring an abstract character-map sensor graphic, technical focus, selected projects, and technology stack.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F4F8FC"/><stop offset="55%" stop-color="#EAF2FA"/><stop offset="100%" stop-color="#F4F8FC"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6554C0"><animate attributeName="stop-color" values="#6554C0;#087EA4;#138A68;#6554C0" dur="12s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#087EA4"><animate attributeName="stop-color" values="#087EA4;#138A68;#6554C0;#087EA4" dur="12s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="halo"><stop offset="0%" stop-color="#087EA4" stop-opacity=".10"/><stop offset="100%" stop-color="#087EA4" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#DCE8F2" stroke-width="1"/></pattern>
  <pattern id="scan" width="4" height="5" patternUnits="userSpaceOnUse"><path d="M0 4.5H4" stroke="#087EA4" stroke-opacity=".07" stroke-width=".6"/></pattern>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="frameClip"><rect x="10" y="10" width="1160" height="590" rx="22"/></clipPath>
</defs>
