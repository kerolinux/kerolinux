  .tiny { font-size:10px; letter-spacing:1.5px; } .small { font-size:12px; }
  .label { fill:#087EA4; font-size:10px; letter-spacing:1.4px; }
  .ascii { fill:#087EA4; font-size:13px; font-weight:700; letter-spacing:1.6px; }
  .pill { fill:#F5FAFF; stroke:#C8D8E7; stroke-width:1; }
  .value { fill:#13263A; font-size:12px; }
</style>
